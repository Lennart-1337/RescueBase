name: Route Dependabot to Staging

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: dependabot-routing-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  route:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Only trusted base-branch code runs with write permissions.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { routePullRequest } = require('./scripts/ci/dependabot-staging.cjs');
            await routePullRequest(github, context.repo, context.issue.number,
              context.payload.repository.default_branch);
